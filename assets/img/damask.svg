<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <!-- Palmetta: foglia centrale + due laterali, come nei damascati classici -->
    <g id="palmetta">
      <path d="M0-30 C11-19 16-8 16 1 C16 12 9 21 0 26 C-9 21 -16 12 -16 1 C-16-8 -11-19 0-30 Z"/>
      <path d="M0-30 C11-19 16-8 16 1 C16 12 9 21 0 26 C-9 21 -16 12 -16 1 C-16-8 -11-19 0-30 Z"
            transform="rotate(120) scale(.62)"/>
      <path d="M0-30 C11-19 16-8 16 1 C16 12 9 21 0 26 C-9 21 -16 12 -16 1 C-16-8 -11-19 0-30 Z"
            transform="rotate(-120) scale(.62)"/>
      <circle cx="0" cy="0" r="3.4"/>
    </g>
    <!-- Voluta: il ricciolo che unisce i motivi -->
    <path id="voluta" d="M0 0 C14-4 24-14 26-28" />
  </defs>

  <g fill="none" stroke="#ffffff" stroke-width="1.7" stroke-opacity=".055" stroke-linecap="round">
    <!-- reticolo a losanghe (ogivale) -->
    <path d="M90 0 L180 90 L90 180 L0 90 Z"/>
    <path d="M0 0 L90 90 L0 180 M180 0 L90 90 L180 180" stroke-opacity=".022"/>

    <!-- motivo centrale -->
    <use href="#palmetta" x="90" y="90"/>
    <g stroke-opacity=".035">
      <use href="#voluta" transform="translate(90,90)"/>
      <use href="#voluta" transform="translate(90,90) scale(-1,1)"/>
      <use href="#voluta" transform="translate(90,90) scale(1,-1)"/>
      <use href="#voluta" transform="translate(90,90) scale(-1,-1)"/>
    </g>

    <!-- quarti agli angoli: fanno combaciare le piastrelle -->
    <use href="#palmetta" x="0" y="0"/>
    <use href="#palmetta" x="180" y="0"/>
    <use href="#palmetta" x="0" y="180"/>
    <use href="#palmetta" x="180" y="180"/>
  </g>
</svg>
